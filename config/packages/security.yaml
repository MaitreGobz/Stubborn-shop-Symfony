security:
    # Password hashing
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # Loading users
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Authentication via form
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home

            # Logout
            logout:
                path: app_logout
                target: app_home

    # Safety rules according to the roads
    access_control:
        # Back office reserved for admin
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Shopping cart and store accessible only to logged-in users
        - { path: ^/cart, roles: ROLE_USER }
        - { path: ^/products, roles: ROLE_USER }

        # Registration and login are accessible without being logged in.
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # Homepage accessible to everyone
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

        firewalls:
            main:
                lazy: true
